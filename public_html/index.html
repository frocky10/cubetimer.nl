<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="google-adsense-account" content="ca-pub-9889350952616788">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" content="timer, cubetimer, rubiks cube timer, online timer, webtimer, speedcube, cubeing, wca, wcatimer, speedcubetimer, cube record, stopwatch">
  <title>CubeTimer</title>
  <link rel="icon" type="image/png" href="Pictures\CubeTimerFavicon_V2.png" />
  <link rel="stylesheet" href="Style/style.css" />
</head>
<body>
  <img id="logo" src="Pictures\CubeTimerLogo_V2.png" alt="Logo" />

  <div id="times-table">
    <table>
      <thead>
        <tr><th>#</th><th>Time</th><th>AO5</th><th>AO12</th></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div class="toggle-wrapper">
    <div class="toggle" id="theme-toggle">
      <span class="toggle-icon moon active">🌙</span>
      <span class="toggle-icon sun">☀️</span>
      <div class="toggle-knob"></div>
    </div>
  </div>

  <div id="timer">00:00:000</div>

  <script>
    let startTime = null;
    let running = false;
    let interval = null;
    let times = [];
    let lastDisplayTime = 0;

    function formatTime(ms) {
      const total = Math.floor(ms);
      return `${String(Math.floor(total / 60000)).padStart(2,'0')}:${String(Math.floor((total % 60000)/1000)).padStart(2,'0')}:${String(total % 1000).padStart(3,'0')}`;
    }

    function updateTimer() {
      lastDisplayTime = performance.now() - startTime;
      document.getElementById("timer").textContent = formatTime(lastDisplayTime);
    }

    function calculateAverage(list, count) {
      if (list.length < count) return "-";
      const arr = list.slice(-count).map(t => t.raw).sort((a,b)=>a-b);
      const trimmed = arr.slice(1, arr.length-1);
      return formatTime(trimmed.reduce((a,b)=>a+b,0) / trimmed.length);
    }

    function saveTime(ms) {
      times.push({ raw: ms, formatted: formatTime(ms) });
      const row = document.createElement('tr');
      row.innerHTML = `<td>${times.length}</td><td>${formatTime(ms)}</td><td>${calculateAverage(times,5)}</td><td>${calculateAverage(times,12)}</td>`;
      document.getElementById('table-body').appendChild(row);
    }

    function startTimer() {
      startTime = performance.now();
      interval = setInterval(updateTimer, 10);
      running = true;
    }

    function stopTimer() {
      clearInterval(interval);
      running = false;
      saveTime(lastDisplayTime);
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        running ? stopTimer() : startTimer();
      }
    });

    const toggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
    const moonIcon = document.querySelector('.moon');
    const sunIcon = document.querySelector('.sun');

    toggle.addEventListener('click', () => {
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      moonIcon.classList.toggle('active', !isDark);
      sunIcon.classList.toggle('active', isDark);
    });
  </script>

</body>
</html>
