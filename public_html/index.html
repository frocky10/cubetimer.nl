<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
    <meta charset="UTF-8" />
    <meta name="google-adsense-account" content="ca-pub-9889350952616788">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="timer, cubetimer, rubiks cube timer, online timer, webtimer, speedcube, cubeing, wca, wcatimer, speedcubetimer, cube record, stopwatch">
    <title>CubeTimer</title>
    <link rel="icon" type="image/png" href="Pictures\CubeTimerFavicon_V2.png" />
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="Style/style.css" />
    <script src="Script/script.js" defer></script>
    <script type="module" src="Script/scrambleScript.js" defer></script>
    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container-fluid h-100 g-0">
            <div class="row h-100 g-0">
                <!-- Sidebar: Times Table -->
                <aside class="col-lg-3 col-md-4 col-12 order-lg-1 order-2 d-flex flex-column">
                    <div class="logo-sidebar-wrapper d-flex justify-content-center py-3 d-none d-lg-flex">
                        <img id="logo-sidebar" src="Pictures\CubeTimerLogo_V2.png" alt="Logo" />
                    </div>
                    <div id="times-table">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Time</th>
                                    <th>AO5</th>
                                    <th>AO12</th>
                                </tr>
                            </thead>
                            <tbody id="table-body"></tbody>
                        </table>
                    </div>
                </aside>

                <!-- Main Timer Area -->
                <div class="col-lg-9 col-md-8 col-12 order-lg-2 order-1 d-flex flex-column">
                    <!-- Header -->
                    <header class="position-relative py-3 flex-shrink-0">
                        <div class="logo-header-wrapper d-flex justify-content-center d-lg-none mb-2">
                            <img id="logo-header" src="Pictures\CubeTimerLogo_V2.png" alt="Logo" />
                        </div>
                        <div class="toggle-wrapper">
                            <div class="toggle" id="theme-toggle">
                                <span class="toggle-icon moon active">🌙</span>
                                <span class="toggle-icon sun">☀️</span>
                                <div class="toggle-knob"></div>
                            </div>
                        </div>
                    </header>
                      
                    <div class="flex-grow-1 d-flex align-items-center justify-content-center gap-4">
                        <div id="ready-lights">
                            <div class="ready-light" id="light1"></div>
                            <div class="ready-light" id="light2"></div>
                        </div>
                        <div id="timer">00:00:000</div>
                    </div>
                      
                    <!-- Scrambles at bottom of main component -->
                    <footer class="py-3 flex-shrink-0">
                        <div id="Scrambles" class="ScrambleBox mx-auto">
                        </div>
                    </footer>
                </div>
            </div>
        </div>
    </body>
</html>
